name: Dev test and build

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/detect-services
        id: detect
        with:
          last-built-tag: last-built-dev

  build:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: ${{ matrix.service }}
      tag: dev
    secrets: inherit

  mark-built:
    name: Mark commit as built
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/mark-built
        with:
          tag: last-built-dev